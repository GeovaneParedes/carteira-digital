apiVersion: apps/v1
kind: Deployment
metadata:
  name: carteira-frontend
  labels:
    app: carteira-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carteira-frontend
  template:
    metadata:
      labels:
        app: carteira-frontend
    spec:
      containers:
      - name: frontend
        image: gereciamento-conta-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: carteira-configmap
              key: NEXT_PUBLIC_API_URL
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: carteira-frontend
  labels:
    app: carteira-frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: carteira-frontend
