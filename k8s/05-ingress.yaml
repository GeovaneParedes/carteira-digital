apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carteira-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: carteira-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: carteira-frontend
            port:
              number: 3000
